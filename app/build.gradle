plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anas.myretro'
    compileSdk 34

    defaultConfig {
        applicationId "com.anas.myretro"
        minSdk 21
        // 34 = Android 14 : l'appli s'installe sur les telephones recents ET sur Android 5.1
        targetSdk 34
        versionCode 8
        versionName "4.1"
    }

    // Meme cle de signature a chaque build : la mise a jour s'installe par-dessus
    // l'ancienne version et les reglages (login, dossiers...) sont conserves.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // OkHttp 3.12.x : derniere branche qui supporte Android 5.x
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
}
